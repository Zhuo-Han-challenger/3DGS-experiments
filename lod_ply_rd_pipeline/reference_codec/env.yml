name: xcodec
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.3.0
  - cpuonly
  - loguru
  - tqdm
  - numpy
  - setuptools
  - pip
  - pillow
  - tyro
  - yaml
  - zstd
  - ffmpeg-python
  - pybind11
  - matplotlib
  - scipy
  - pip:
    - dependency/sorting
    - dependency/astcenc
    - msgpack
    - opencv-python